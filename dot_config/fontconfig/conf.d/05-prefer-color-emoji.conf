<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Restore color emoji in terminals after the fontconfig 2.18 change.

       Under 2.18, a monochrome text font that happens to cover an emoji or
       symbol codepoint outranks the Noto Color Emoji fallback that the
       system 75-noto-color-emoji.conf merely appends, so terminals draw emoji
       flat.

       Fix: at scan time, remove the emoji codepoints from the competing
       monochrome fonts so nothing but the color font covers them. The color
       font then wins the fallback chain for emoji while ordinary text and the
       generic sans-serif/serif/monospace families are left untouched.

       We deliberately do NOT prepend Noto Color Emoji to the generic families:
       that makes it the *primary* resolved family, and GTK/Qt read the primary
       family for their UI font, which renders every desktop app in the emoji
       font. -->

  <!-- DejaVu Sans / DejaVu Sans Mono carry monochrome outlines for ~180 emoji
       codepoints; drop them at scan time so even a direct request for the
       family defers to the color font for those codepoints. (c) (r) (tm), ZWJ
       and VS16 are preserved so text stays intact. -->
  <match target="scan">
    <test name="family" compare="contains"><string>DejaVu Sans</string></test>
    <edit name="charset" mode="assign">
      <minus>
        <name>charset</name>
        <charset>
        <int>0x203C</int>
        <int>0x2049</int>
        <int>0x2139</int>
        <range><int>0x2194</int><int>0x2199</int></range>
        <range><int>0x21A9</int><int>0x21AA</int></range>
        <int>0x2328</int>
        <int>0x23CF</int>
        <range><int>0x25AA</int><int>0x25AB</int></range>
        <int>0x25B6</int>
        <int>0x25C0</int>
        <range><int>0x25FB</int><int>0x25FE</int></range>
        <range><int>0x2600</int><int>0x2604</int></range>
        <int>0x260E</int>
        <int>0x2611</int>
        <range><int>0x2614</int><int>0x2615</int></range>
        <int>0x2618</int>
        <int>0x261D</int>
        <int>0x2620</int>
        <range><int>0x2622</int><int>0x2623</int></range>
        <int>0x2626</int>
        <int>0x262A</int>
        <range><int>0x262E</int><int>0x262F</int></range>
        <range><int>0x2638</int><int>0x263A</int></range>
        <int>0x2640</int>
        <int>0x2642</int>
        <range><int>0x2648</int><int>0x2653</int></range>
        <range><int>0x265F</int><int>0x2660</int></range>
        <int>0x2663</int>
        <range><int>0x2665</int><int>0x2666</int></range>
        <int>0x2668</int>
        <int>0x267B</int>
        <range><int>0x267E</int><int>0x267F</int></range>
        <range><int>0x2692</int><int>0x2697</int></range>
        <int>0x2699</int>
        <range><int>0x269B</int><int>0x269C</int></range>
        <range><int>0x26A0</int><int>0x26A1</int></range>
        <int>0x26A7</int>
        <range><int>0x26AA</int><int>0x26AB</int></range>
        <range><int>0x26B0</int><int>0x26B1</int></range>
        <int>0x2702</int>
        <range><int>0x2708</int><int>0x2709</int></range>
        <range><int>0x270C</int><int>0x270D</int></range>
        <int>0x270F</int>
        <int>0x2712</int>
        <int>0x2714</int>
        <int>0x2716</int>
        <int>0x271D</int>
        <int>0x2721</int>
        <range><int>0x2733</int><int>0x2734</int></range>
        <int>0x2744</int>
        <int>0x2747</int>
        <range><int>0x2763</int><int>0x2764</int></range>
        <int>0x27A1</int>
        <range><int>0x2B05</int><int>0x2B07</int></range>
        <!-- entire supplementary-plane emoji blocks (future-proof) -->
        <range><int>0x1F000</int><int>0x1FAFF</int></range>
        </charset>
      </minus>
    </edit>
  </match>
</fontconfig>
