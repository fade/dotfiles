;; -*-lisp-*-
;; Projects such as mallet keep a private bundle of their dependencies
;; under .bundle-libs. Those copies are for that project alone; left on
;; the tree they shadow the real checkouts for every other system.
;;
;; ASDF's inherited defaults would scan ~/common-lisp, which links to
;; this same workspace, without these exclusions and so put the bundles
;; back. Nothing is inherited; the one other useful location, the
;; system's Lisp packages, is named below instead.
;;
;; The SBCL source checkout (sbcl/) is excluded too. Its contrib .asd
;; files, and the copies its build leaves under obj/, are SBCL's own
;; build inputs; SBCL refuses to build contribs through ASDF. The
;; contribs a program needs come from the installed SBCL, so the
;; checkout must never be found by name.
(:source-registry
 (:also-exclude ".bundle-libs")
 (:also-exclude "sbcl")
 ;; .attic holds checkouts kept for reference that no build may find:
 ;; pristine upstream clones beside the renamed fork we build and submit
 ;; from, and backups. A directory moved there drops out of every search.
 (:also-exclude ".attic")
 ;; Each repository's .planning is a link out to its coordination state,
 ;; which keeps extracted builds and test fixtures with their own .asd
 ;; files. None of it is source a build should load.
 (:also-exclude ".planning")
 (:tree (:home "SourceCode/lisp"))
 (:tree (:home ".stumpwm.d/modules"))
 (:tree "/usr/share/common-lisp/source/")
 :ignore-inherited-configuration)
